[package]
name = "command_vault"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
iced = { version = "0.14", features = ["advanced"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
