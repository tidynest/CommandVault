# cargo-deny configuration, run by `cargo deny check` and the deny job in CI.
# cargo-deny 0.20 rejects every licence that is not listed, so the permissive
# licences of the dependency tree are listed here. Add to this list when a new
# dependency brings a new one; never add a copyleft licence without a decision.
#
# No copyleft licence is allowed. Crates that offer LGPL or GPL as one option
# also offer MIT or Apache-2.0, and that alternative satisfies the check.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
yanked = "deny"
ignore = [
    # Both are "unmaintained" notices, not vulnerabilities. Both arrive through
    # iced's font and macro stack with no upgrade path until iced swaps them.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive macro dep via iced_wgpu" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via cosmic-text and fontdb under iced" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
